name: Apply engrXiv publication update

on:
  push:
    paths:
      - ".github/workflows/apply-engrxiv-publication-update.yml"

permissions:
  contents: write

jobs:
  update-publication-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate published engrXiv preprint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          DOI = "10.31224/7979"
          TITLE = "Reliability Boundaries under Synthetic Post-Earthquake Road Disruption: A Reproducible Graph-Based Monte Carlo Study of Emergency-Response Accessibility in Beykoz, Istanbul"

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def before(text, anchor, addition, label):
              if addition.strip() in text:
                  return text
              if anchor not in text:
                  raise RuntimeError(f"{label}: anchor not found")
              return text.replace(anchor, addition + anchor, 1)

          def after(text, anchor, addition, label):
              if addition.strip() in text:
                  return text
              if anchor not in text:
                  raise RuntimeError(f"{label}: anchor not found")
              return text.replace(anchor, anchor + addition, 1)

          def repl(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise RuntimeError(f"{label}: source text not found")
              return text.replace(old, new, 1)

          # README.md
          p = "README.md"
          t = read(p)

          badge = '''  <a href="https://doi.org/10.31224/7979">
            <img alt="engrXiv Preprint DOI" src="https://img.shields.io/badge/engrXiv-10.31224%2F7979-6f42c1.svg">
          </a>
          '''
          t = before(
              t,
              '  <img alt="Version 1.0.0" src="https://img.shields.io/badge/version-1.0.0-2f6f9f.svg">\n',
              badge,
              "README badge",
          )

          t = after(
              t,
              '  <a href="ABOUT.md">About</a> ·\n',
              '  <a href="PUBLICATIONS.md">Publications</a> ·\n'
              '  <a href="https://doi.org/10.31224/7979">engrXiv Preprint</a> ·\n',
              "README nav",
          )

          t = after(
              t,
              '- **OSF Registration DOI (accepted retrospective Open-Ended Registration):** [10.17605/OSF.IO/ZTJXK](https://doi.org/10.17605/OSF.IO/ZTJXK)\n',
              '- **Published engrXiv preprint DOI:** [10.31224/7979](https://doi.org/10.31224/7979)\n',
              "README EN DOI",
          )

          en_block = '''### Published preprint

          The completed v1.0 research study is published as **engrXiv Preprint / Version 1**:

          **Faramarz Kowsari (2026). _Reliability Boundaries under Synthetic Post-Earthquake Road Disruption: A Reproducible Graph-Based Monte Carlo Study of Emergency-Response Accessibility in Beykoz, Istanbul._**

          - **DOI:** [10.31224/7979](https://doi.org/10.31224/7979)
          - **Publication index:** [PUBLICATIONS.md](PUBLICATIONS.md)
          - **Repository preprint record:** [research/preprints/engrxiv-7979/](research/preprints/engrxiv-7979/)
          - **License:** CC BY 4.0

          The engrXiv record is the citable research manuscript. The Zenodo version DOI remains the citation for the frozen v1.0.0 software/research release, and the OSF DOI remains the accepted retrospective registration record.

          '''
          t = before(t, "## What is implemented\n", en_block, "README published preprint block")

          t = after(
              t,
              '- **OSF Registration DOI (kabul edilmiş retrospektif Open-Ended Registration):** [10.17605/OSF.IO/ZTJXK](https://doi.org/10.17605/OSF.IO/ZTJXK)\n',
              '- **Yayımlanmış engrXiv preprint DOI:** [10.31224/7979](https://doi.org/10.31224/7979)\n',
              "README TR DOI",
          )

          t = after(
              t,
              '- **DOI del registro OSF (registro abierto retrospectivo aceptado):** [10.17605/OSF.IO/ZTJXK](https://doi.org/10.17605/OSF.IO/ZTJXK)\n',
              '- **DOI del preprint publicado en engrXiv:** [10.31224/7979](https://doi.org/10.31224/7979)\n',
              "README ES DOI",
          )

          t = repl(
              t,
              'Please use [`CITATION.cff`](CITATION.cff) for machine-readable citation metadata. The research methodology and provenance are additionally preserved in an accepted retrospective [Open-Ended OSF Registration](https://doi.org/10.17605/OSF.IO/ZTJXK). For the frozen\nv1.0.0 release, cite the version DOI:\n',
              'Please use [`CITATION.cff`](CITATION.cff) for machine-readable citation metadata. For the **research manuscript**, cite the published engrXiv preprint DOI [10.31224/7979](https://doi.org/10.31224/7979). The research methodology and provenance are additionally preserved in an accepted retrospective [Open-Ended OSF Registration](https://doi.org/10.17605/OSF.IO/ZTJXK). For the frozen\nv1.0.0 software/research release, cite the Zenodo version DOI:\n',
              "README citation guidance",
          )

          t = before(
              t,
              '**Version DOI:** [10.5281/zenodo.21903851](https://doi.org/10.5281/zenodo.21903851)  \n',
              '**engrXiv Preprint DOI:** [10.31224/7979](https://doi.org/10.31224/7979)  \n',
              "README citation DOI",
          )
          write(p, t)

          # CITATION.cff
          p = "CITATION.cff"
          t = read(p)
          t = repl(
              t,
              'message: "If you use this software or its research results, cite the frozen v1.0.0 release with DOI 10.5281/zenodo.21903851. Use the Concept DOI 10.5281/zenodo.21903850 when referring to the project across versions. The accepted retrospective Open-Ended OSF Registration documenting methodology and provenance is DOI 10.17605/OSF.IO/ZTJXK."',
              'message: "For the research manuscript, cite the published engrXiv preprint DOI 10.31224/7979. For the frozen v1.0.0 software/research release, cite DOI 10.5281/zenodo.21903851. Use Concept DOI 10.5281/zenodo.21903850 for the project across versions. The accepted retrospective Open-Ended OSF Registration is DOI 10.17605/OSF.IO/ZTJXK."',
              "CITATION message",
          )

          t = after(
              t,
              '  - type: doi\n'
              '    value: 10.17605/OSF.IO/ZTJXK\n'
              '    description: "Accepted retrospective Open-Ended OSF Registration documenting research methodology and provenance"\n',
              '  - type: doi\n'
              '    value: 10.31224/7979\n'
              '    description: "Published engrXiv preprint DOI for the v1.0 research manuscript"\n',
              "CITATION identifier",
          )

          if "The associated research manuscript is published on engrXiv" not in t:
              t = t.replace(
                  "  Open-Ended OSF Registration (DOI 10.17605/OSF.IO/ZTJXK).",
                  "  Open-Ended OSF Registration (DOI 10.17605/OSF.IO/ZTJXK).\n"
                  "  The associated research manuscript is published on engrXiv as Version 1 (DOI 10.31224/7979).",
                  1,
              )
          write(p, t)

          # ABOUT.md
          p = "ABOUT.md"
          t = read(p)
          t = after(
              t,
              "- **Accepted OSF Registration DOI:** https://doi.org/10.17605/OSF.IO/ZTJXK\n",
              "- **Published engrXiv preprint DOI:** https://doi.org/10.31224/7979\n"
              "- **Publication index:** https://github.com/FaramarzKowsari/turkiye-disaster-intelligence-digital-twin/blob/main/PUBLICATIONS.md\n",
              "ABOUT EN",
          )
          t = after(
              t,
              "- **Kabul edilmiş OSF Registration DOI:** https://doi.org/10.17605/OSF.IO/ZTJXK\n",
              "- **Yayımlanmış engrXiv preprint DOI:** https://doi.org/10.31224/7979\n",
              "ABOUT TR",
          )
          t = after(
              t,
              "- **DOI del registro OSF aceptado:** https://doi.org/10.17605/OSF.IO/ZTJXK\n",
              "- **DOI del preprint publicado en engrXiv:** https://doi.org/10.31224/7979\n",
              "ABOUT ES",
          )
          write(p, t)

          # CHANGELOG.md
          p = "CHANGELOG.md"
          t = read(p)
          change = '''## 2026-08-18 — Published engrXiv preprint integration

          - Integrated engrXiv Preprint / Version 1 DOI `10.31224/7979` into README, citation metadata, About page, and GitHub Pages.
          - Preserved Zenodo version/concept DOIs and the retrospective OSF registration DOI as distinct records.
          - Linked the repository publication index and archived preprint materials.

          '''
          if "## 2026-08-18 — Published engrXiv preprint integration" not in t:
              i = t.find("\n")
              t = t[:i+1] + "\n" + change + t[i+1:]
          write(p, t)

          # docs/index.html
          p = "docs/index.html"
          t = read(p)
          if "https://doi.org/10.31224/7979" not in t:
              t = repl(
                  t,
                  '      "https://doi.org/10.17605/OSF.IO/ZTJXK"\n',
                  '      "https://doi.org/10.17605/OSF.IO/ZTJXK",\n'
                  '      "https://doi.org/10.31224/7979"\n',
                  "index JSON-LD",
              )
              t = before(
                  t,
                  '        <a class="button" href="https://doi.org/10.5281/zenodo.21903851">DOI v1.0.0</a>\n',
                  '        <a class="button primary" href="https://doi.org/10.31224/7979">Published engrXiv Preprint · DOI 10.31224/7979</a>\n',
                  "index action",
              )
              t = after(
                  t,
                  '      <span><a href="https://doi.org/10.17605/OSF.IO/ZTJXK">Accepted retrospective OSF Registration · 10.17605/OSF.IO/ZTJXK</a></span>\n',
                  '      <span><a href="https://doi.org/10.31224/7979">Published engrXiv Preprint · 10.31224/7979</a></span>\n',
                  "index banner",
              )
          write(p, t)

          # docs/project.html
          p = "docs/project.html"
          t = read(p)
          if "https://doi.org/10.31224/7979" not in t:
              t = repl(
                  t,
                  '      "https://doi.org/10.17605/OSF.IO/ZTJXK"\n',
                  '      "https://doi.org/10.17605/OSF.IO/ZTJXK",\n'
                  '      "https://doi.org/10.31224/7979"\n',
                  "project JSON-LD",
              )
              t = before(
                  t,
                  '        <a class="button primary" href="https://doi.org/10.5281/zenodo.21903851">DOI 10.5281/zenodo.21903851</a>\n',
                  '        <a class="button primary" href="https://doi.org/10.31224/7979">Published Preprint · 10.31224/7979</a>\n',
                  "project action",
              )
              t = after(
                  t,
                  '      <strong><a href="https://doi.org/10.17605/OSF.IO/ZTJXK">OSF Registration DOI · 10.17605/OSF.IO/ZTJXK</a></strong>\n',
                  '      <strong><a href="https://doi.org/10.31224/7979">engrXiv Preprint DOI · 10.31224/7979</a></strong>\n',
                  "project banner",
              )
          write(p, t)

          # docs/research-findings.html
          p = "docs/research-findings.html"
          t = read(p)
          if "10.31224/7979" not in t:
              t = repl(
                  t,
                  '  <meta name="citation_title" content="Türkiye Disaster Intelligence Digital Twin">\n',
                  f'  <meta name="citation_title" content="{TITLE}">\n',
                  "findings title",
              )
              t = repl(
                  t,
                  '  <meta name="citation_publication_date" content="2026-08-12">\n',
                  '  <meta name="citation_publication_date" content="2026-08-17">\n',
                  "findings date",
              )
              t = repl(
                  t,
                  '  <meta name="citation_doi" content="10.5281/zenodo.21903851">\n',
                  '  <meta name="citation_doi" content="10.31224/7979">\n',
                  "findings DOI",
              )
              t = repl(
                  t,
                  '  <link rel="cite-as" href="https://doi.org/10.5281/zenodo.21903851">\n',
                  '  <link rel="cite-as" href="https://doi.org/10.31224/7979">\n',
                  "findings cite-as",
              )
              t = after(
                  t,
                  '<div class="page-links">',
                  '<a href="https://doi.org/10.31224/7979">engrXiv Preprint</a>',
                  "findings nav",
              )
              t = after(
                  t,
                  '      <span><a href="https://doi.org/10.17605/OSF.IO/ZTJXK">OSF Registration DOI · 10.17605/OSF.IO/ZTJXK</a></span>\n',
                  '      <span><a href="https://doi.org/10.31224/7979">Published engrXiv Preprint · 10.31224/7979</a></span>\n',
                  "findings banner",
              )
          write(p, t)

          # Validate DOI across public metadata and already-uploaded publication records.
          targets = [
              "README.md",
              "CITATION.cff",
              "ABOUT.md",
              "CHANGELOG.md",
              "docs/index.html",
              "docs/project.html",
              "docs/research-findings.html",
              "PUBLICATIONS.md",
              "research/README.md",
              "research/preprints/engrxiv-7979/README.md",
          ]
          for f in targets:
              if DOI not in read(f):
                  raise RuntimeError(f"Validation failed: {DOI} missing from {f}")

          print("Repository-specific engrXiv integration completed and validated.")
          PY

          # Clean temporary helper/patch files left from earlier upload packages.
          rm -f INSTALL.txt README_FIRST.txt README_FIXED_PATCH.txt README_PATCH_NOTES.txt README_PUBLICATION_BLOCK.md
          rm -rf .osf_doi_backup_20260815_074243

      - name: Commit publication integration
        shell: bash
        run: |
          git config user.name "FaramarzKowsari"
          git config user.email "105053743+FaramarzKowsari@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes required."
            exit 0
          fi
          git commit -m "Integrate published engrXiv preprint DOI 10.31224/7979"
          git push
