      - name: Show change summary
        shell: bash
        run: |
          git status --short
          git diff --stat
          echo
          echo "engrXiv DOI occurrences:"
          grep -R --line-number --fixed-strings "10.31224/7986" \
            README.md CITATION.cff CHANGELOG.md docs manuscript/PUBLISHED_PREPRINT.md | head -80

      - name: Commit and push publication update
        shell: bash
        run: |
          git config user.name "FaramarzKowsari"
          git config user.email "105053743+FaramarzKowsari@users.noreply.github.com"
          git add README.md CITATION.cff CHANGELOG.md \
            docs/index.html \
            docs/registered-confirmatory-study.html \
            docs/confirmatory-results.html \
            docs/tr/index.html \
            docs/es/index.html \
            docs/st-gnn-istanbul.html \
            docs/research-findings.html \
            docs/registered-confirmatory-dataset.html \
            manuscript/PUBLISHED_PREPRINT.md
          if git diff --cached --quiet; then
            echo "No changes to commit; publication update is already applied."
            exit 0
          fi
          git commit -m "Link published engrXiv preprint DOI 10.31224/7986"
          git push
