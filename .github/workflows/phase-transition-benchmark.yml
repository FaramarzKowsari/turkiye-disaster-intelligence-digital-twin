name: Coupled Phase Boundary Benchmark

on:
  workflow_dispatch:
    inputs:
      place:
        description: İstanbul pilot district
        required: true
        default: "Beykoz, İstanbul, Türkiye"
        type: choice
        options:
          - "Beykoz, İstanbul, Türkiye"
          - "Üsküdar, İstanbul, Türkiye"
          - "Kadıköy, İstanbul, Türkiye"
          - "Fatih, İstanbul, Türkiye"
          - "Beşiktaş, İstanbul, Türkiye"
      realizations:
        description: Realisations per severity × responder cell
        required: true
        default: "100"
        type: choice
        options:
          - "50"
          - "100"
          - "200"
      severities:
        description: Comma-separated synthetic disruption severities
        required: true
        default: "0.10,0.12,0.13,0.14,0.15,0.16,0.18,0.20"
        type: string
      responders:
        description: Comma-separated responder counts
        required: true
        default: "8,10,12,14,16,20,24,32"
        type: string
      incidents:
        description: Synthetic incidents per realisation
        required: true
        default: "10"
        type: string
      base_seed:
        description: Base random seed
        required: true
        default: "6060"
        type: string

permissions:
  contents: read

jobs:
  phase-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[research]"

      - name: Run coupled severity x responder benchmark
        run: |
          python scripts/run_phase_transition_benchmark.py \
            --place "${{ inputs.place }}" \
            --realizations "${{ inputs.realizations }}" \
            --severities "${{ inputs.severities }}" \
            --responders "${{ inputs.responders }}" \
            --incidents "${{ inputs.incidents }}" \
            --base-seed "${{ inputs.base_seed }}" \
            --collapse-threshold 20 \
            --target-reachability 80 \
            --reliability-target 80 \
            --bootstrap-resamples 3000 \
            --permutation-samples 5000 \
            --output "artifacts/coupled-phase-boundary-${{ github.run_id }}-attempt-${{ github.run_attempt }}"

      - name: Verify coupled phase-boundary bundle
        run: |
          test -f "artifacts/coupled-phase-boundary-${{ github.run_id }}-attempt-${{ github.run_attempt }}/raw_phase_experiments.csv"
          test -f "artifacts/coupled-phase-boundary-${{ github.run_id }}-attempt-${{ github.run_attempt }}/phase_surface.parquet"
          test -f "artifacts/coupled-phase-boundary-${{ github.run_id }}-attempt-${{ github.run_attempt }}/resource_frontier.csv"
          test -f "artifacts/coupled-phase-boundary-${{ github.run_id }}-attempt-${{ github.run_attempt }}/marginal_resource_gains.csv"
          test -f "artifacts/coupled-phase-boundary-${{ github.run_id }}-attempt-${{ github.run_attempt }}/paired_grid_inference.csv"
          test -f "artifacts/coupled-phase-boundary-${{ github.run_id }}-attempt-${{ github.run_attempt }}/manifest.json"
          test -f "artifacts/coupled-phase-boundary-${{ github.run_id }}-attempt-${{ github.run_attempt }}/SHA256SUMS"

      - name: Upload coupled phase-boundary artifact
        uses: actions/upload-artifact@v4
        with:
          name: disaster-twin-coupled-phase-boundary-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/coupled-phase-boundary-${{ github.run_id }}-attempt-${{ github.run_attempt }}/
          retention-days: 30
          if-no-files-found: error
